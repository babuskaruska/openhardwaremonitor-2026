name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A v* tag builds a release, whose version string drops the -dev suffix.
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          "InformationalVersion=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build OpenHardwareMonitor.slnx -c Release

      - name: Test
        run: dotnet test tests/OpenHardwareMonitor.Tests/OpenHardwareMonitor.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish win-x64 (self-contained, single file)
        run: dotnet publish OpenHardwareMonitor.csproj -c Release -p:PublishProfile=SelfContained-win-x64

      - name: Publish win-arm64 (experimental)
        run: dotnet publish OpenHardwareMonitor.csproj -c Release -p:PublishProfile=SelfContained-win-arm64

      # The reason this fork exists: never ship a kernel driver. WinRing0 was
      # both a known vulnerability (CVE-2020-14979) and the cause of antivirus
      # detections. Fail the build if any driver payload reappears.
      - name: Verify no driver payload
        shell: pwsh
        run: |
          $drivers = Get-ChildItem artifacts/publish -Recurse -Include *.sys, *.inf, *.cat
          if ($drivers) {
            Write-Error "Driver payload found: $($drivers.FullName -join ', ')"
            exit 1
          }
          Write-Output "No driver payload in the published output."

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path artifacts/publish/win-x64/* -DestinationPath dist/OpenHardwareMonitor-win-x64.zip
          Compress-Archive -Path artifacts/publish/win-arm64/* -DestinationPath dist/OpenHardwareMonitor-win-arm64-experimental.zip
          # The executable on its own too: it needs nothing else to run.
          Copy-Item artifacts/publish/win-x64/OpenHardwareMonitor.exe dist/OpenHardwareMonitor.exe
          Get-ChildItem dist/* -Include *.zip, *.exe | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + $_.Name
          } | Set-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OpenHardwareMonitor
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/*.trx

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: OpenHardwareMonitor
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Open Hardware Monitor 2026 ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
