<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Open Hardware Monitor</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="bar">
    <div class="identity">
      <img src="images_icon/computer.png" alt="" width="24" height="24">
      <div>
        <h1 id="machine">Open Hardware Monitor</h1>
        <p id="status" class="status" role="status">Connecting&hellip;</p>
      </div>
    </div>
    <div class="controls">
      <input id="filter" type="search" placeholder="Filter sensors" aria-label="Filter sensors" autocomplete="off">
      <label class="interval">Refresh
        <select id="interval">
          <option value="1000">1 s</option>
          <option value="2000">2 s</option>
          <option value="5000">5 s</option>
          <option value="10000">10 s</option>
        </select>
      </label>
      <button id="unit" type="button" title="Switch temperature unit">&deg;C</button>
    </div>
  </header>

  <p id="tier" class="notice" hidden></p>

  <main id="hardware"></main>

  <noscript>
    <p class="notice">This page needs JavaScript. The raw readings are available at
      <a href="api/v1/sensors">api/v1/sensors</a>.</p>
  </noscript>

  <footer>
    <a id="api-link" href="api/v1/sensors">JSON API</a>
    <span aria-hidden="true">&middot;</span>
    <a id="legacy-link" href="data.json">data.json (legacy)</a>
  </footer>
</body>
</html>
