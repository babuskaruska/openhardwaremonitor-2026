ShortDescription: A modernised Open Hardware Monitor for Windows 10 and 11. Shows temperatures, fan speeds, voltages, load and power, and controls fans, without shipping a kernel driver.
Description: |-
  Open Hardware Monitor 2026 is a modernised fork of Open Hardware Monitor 0.9.6 for .NET 10.
  It reads processors (including hybrid Intel P-cores and E-cores and AMD Zen 5), graphics cards,
  memory, NVMe and SATA drives, and motherboard sensors. Deep sensors such as processor core
  temperatures and motherboard fans use the optional, signed PawnIO driver instead of WinRing0.
  It has an overview, a full sensor list, fan curves with fail-safes, a local web dashboard and
  a one-click diagnostics export. It is a single self-contained executable.
